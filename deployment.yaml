apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: devops-web
  name: devops-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-web
  strategy: {}
  template:
    metadata:
      labels:
        app: devops-web
    spec:
      containers:
      - image: app:v1
        name: app
        ports:
        - containerPort: 8080
        resources: {}
status: {}
