---
- name: Verify Jenkins and Docker services
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check services are active
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - jenkins
        - docker
      changed_when: false

    - name: Check services are enabled
      ansible.builtin.command: "systemctl is-enabled {{ item }}"
      loop:
        - jenkins
        - docker
      changed_when: false
